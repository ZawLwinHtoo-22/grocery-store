userGuide.title=How to Place an Order
userGuide.subtitle=Follow these simple steps to order, pay, and track your purchase.

userGuide.step1.title=1. Select Products & Submit Order
userGuide.step1.desc=Browse products from the Shop page, select your items (Rice, Oil, etc.), and submit your order.

userGuide.step2.title=2. Make Payment & Upload Screenshot
userGuide.step2.desc=Transfer the payment via KBZPay or Wave Money, then upload your transaction screenshot/slip.

userGuide.step3.title=3. Admin Verification & Delivery
userGuide.step3.desc=Our store admin will verify your payment slip. Once confirmed, your items will be dispatched for delivery.

userGuide.step4.title=4. Track Your Order Status
userGuide.step4.desc=Go to "Track Order" and enter your Order Code or Mobile Phone Number to check your delivery status in real time.

