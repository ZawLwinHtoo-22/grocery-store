<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Track Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <section class="summary-panel track-search-panel mx-auto">
        <div class="text-center mb-4">
            <i class="bi bi-search-heart track-search-icon" aria-hidden="true"></i>
            <h1 class="h3 fw-bold mt-3" th:text="#{track.title}">Track Your Order</h1>
            <p class="text-secondary mb-0" th:text="#{track.help}">Enter the tracking code shown after checkout.</p>
        </div>
        <form th:action="@{/track}" method="get">
            <label class="form-label fw-semibold" for="trackingCode" th:text="#{track.code}">Tracking Code</label>
            <div class="input-group input-group-lg">
                <span class="input-group-text"><i class="bi bi-shield-check" aria-hidden="true"></i></span>
                <input id="trackingCode" class="form-control" type="text" name="trackingCode" placeholder="Paste tracking code" required>
                <button class="btn btn-success" type="submit">
                    <i class="bi bi-arrow-right-circle" aria-hidden="true"></i>
                    <span th:text="#{track.button}">Track</span>
                </button>
            </div>
        </form>
        <div class="alert alert-light border mt-4 mb-0" th:text="#{track.note}">
            After admin approval, this page will show KPay/Wave payment details and the screenshot upload box.
        </div>
    </section>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
