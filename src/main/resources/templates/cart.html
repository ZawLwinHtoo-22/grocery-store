<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between gap-2 align-items-md-end mb-3">
        <div>
            <h1 class="h3 fw-bold mb-1">Your Cart</h1>
            <p class="text-secondary mb-0">Confirm quantities and enter delivery details.</p>
        </div>
        <a th:href="@{/}" class="btn btn-outline-success">Continue Shopping</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="list-group" th:if="${!cart.empty}">
                <div class="list-group-item cart-row" th:each="item : ${cart.items}">
                    <img th:src="@{${item.imageUrl}}" th:alt="${item.name}" class="cart-thumb">
                    <div class="flex-grow-1">
                        <h2 class="h6 fw-bold mb-1" th:text="${item.name}">Product</h2>
                        <p class="small text-secondary mb-2">
                            <span th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')}">0</span> MMK /
                            <span th:text="${item.unitLabel}">unit</span>
                        </p>
                        <form th:action="@{/cart/update}" method="post" class="d-flex gap-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="productId" th:value="${item.productId}">
                            <input class="form-control form-control-sm qty-input" name="quantity" type="number" min="0" th:value="${item.quantity}">
                            <button class="btn btn-sm btn-outline-secondary" type="submit">Update</button>
                        </form>
                    </div>
                    <div class="text-end">
                        <div class="fw-bold">
                            <span th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 0, 'POINT')}">0</span> MMK
                        </div>
                        <form th:action="@{/cart/remove}" method="post" class="mt-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="productId" th:value="${item.productId}">
                            <button class="btn btn-sm btn-link text-danger p-0" type="submit">Remove</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="empty-state text-center py-5" th:if="${cart.empty}">
                <h2 class="h5">Your cart is empty.</h2>
                <p class="text-secondary">Add rice or oil products before checkout.</p>
                <a th:href="@{/}" class="btn btn-success">Browse Products</a>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="summary-panel">
                <h2 class="h5 fw-bold">Checkout</h2>
                <div class="d-flex justify-content-between border-bottom py-3 mb-3">
                    <span>Total</span>
                    <strong><span th:text="${#numbers.formatDecimal(cart.total, 0, 'COMMA', 0, 'POINT')}">0</span> MMK</strong>
                </div>
                <form th:action="@{/checkout}" th:object="${checkoutForm}" method="post" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label class="form-label" for="customerName">Name</label>
                        <input id="customerName" class="form-control" th:field="*{customerName}" required>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="phoneNumber">Phone Number</label>
                        <input id="phoneNumber" class="form-control" th:field="*{phoneNumber}" required>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="deliveryAddress">Delivery Address</label>
                        <textarea id="deliveryAddress" class="form-control" rows="4" th:field="*{deliveryAddress}" required></textarea>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('deliveryAddress')}" th:errors="*{deliveryAddress}"></div>
                    </div>
                    <button class="btn btn-success btn-lg w-100" type="submit" th:disabled="${cart.empty}">
                        <i class="bi bi-send-check" aria-hidden="true"></i>
                        Submit Order
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
