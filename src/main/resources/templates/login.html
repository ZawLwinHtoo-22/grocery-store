<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="login-panel">
        <a th:href="@{/}" class="text-success text-decoration-none fw-bold">Rice & Oil Store</a>
        <h1 class="h3 fw-bold mt-3">Staff Portal</h1>
        <p class="text-secondary">Sign in to manage products and orders.</p>
        <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input id="username" class="form-control" type="text" name="username" autofocus required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input id="password" class="form-control" type="password" name="password" required>
            </div>
            <button class="btn btn-success w-100" type="submit">Login</button>
        </form>
    </div>
</main>
</body>
</html>
