<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <div class="row">
        <div class="col-md-6">
            <h1 class="h4" th:text="#{order.history.title}">Order Lookup / History</h1>
                        <p class="text-secondary" th:text="#{order.history.subtitle}">Enter either your tracking code or your phone number to find orders.</p>

            <form th:action="@{/orders/history/search}" method="post">
                <div class="mb-3">
                                <label class="form-label" th:text="#{order.history.trackingLabel}">Tracking Code</label>
                    <input class="form-control" name="trackingCode" placeholder="ORD-20260730-000123">
                </div>
                <div class="mb-3">
                                <label class="form-label" th:text="#{order.history.phoneLabel}">Phone Number</label>
                    <input class="form-control" name="phoneNumber" placeholder="09xxxxxxxx">
                </div>
                            <button class="btn btn-primary" type="submit" th:text="#{order.history.searchButton}">Search</button>
            </form>
        </div>

        <div class="col-md-6" th:if="${orders}">
            <h2 class="h5">Results</h2>
            <div th:if="${#lists.isEmpty(orders)}">No orders found for <strong th:text="${phone}"></strong></div>
            <div class="list-group" th:each="o : ${orders}">
                <a th:href="@{/orders/detail/{code}(code=${o.trackingCode})}" class="list-group-item list-group-item-action">
                    <div class="d-flex justify-content-between">
                        <div>
                            <strong th:text="${o.trackingCode}"></strong>
                            <div class="small text-secondary">Placed: <span th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy')}"></span></div>
                        </div>
                        <div>
                            <div th:text="#{${'status.' + o.status.name()}}"></div>
                            <div class="fw-bold price" th:text="${@currency.format(o.totalAmount, #locale)}"></div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
