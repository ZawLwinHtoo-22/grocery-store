<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h4 fw-bold mb-0">Products</h1>
            <div class="small text-secondary">Manage product catalog</div>
        </div>
        <div>
            <a th:href="@{/admin/products/new}" class="btn btn-primary btn-sm">+ Add New Product</a>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm ms-2">Back to Dashboard</a>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width:80px"></th>
                        <th>Product</th>
                        <th style="width:120px">Price</th>
                        <th style="width:120px">Unit</th>
                        <th style="width:140px">Stock</th>
                        <th class="text-end" style="width:180px">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${products}">
                        <td>
                            <img th:src="${p.imageUrl}" alt="img" class="img-thumbnail" style="height:56px; width:56px; object-fit:cover;">
                        </td>
                        <td>
                            <div class="fw-semibold" th:text="${p.name}">Product Name</div>
                        </td>
                        <td class="fw-bold" th:text="${@currency.format(p.price, #locale)}">0</td>
                        <td th:text="${p.unitLabel}">unit</td>
                        <td>
                            <span th:classappend="${p.available} ? 'badge bg-success' : 'badge bg-danger'" th:text="${p.available} ? 'In Stock' : 'Out of Stock'">Stock</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" th:object="${p}" class="d-inline-block ms-1">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this product? This cannot be undone.')">Delete</button>
                            </form>
                            <form th:action="@{/admin/products/{id}/toggle(id=${p.id})}" method="post" class="d-inline-block ms-1">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="${p.available} ? 'Set Out of Stock' : 'Set In Stock'"></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="6" class="text-center py-5 text-secondary">
                            <i class="bi bi-box-seam display-5 mb-2"></i>
                            <div>No products found.</div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
