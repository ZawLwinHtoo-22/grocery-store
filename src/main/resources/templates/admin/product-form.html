<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editing} ? 'Edit Product' : 'Add Product'">Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 fw-bold mb-3" th:text="${editing} ? 'Edit Product' : 'Add New Product'">Add Product</h2>

                    <form th:action="@{/admin/products/save}" th:object="${productForm}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Enter product name" required maxlength="120">
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="row g-2">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Price (MMK)</label>
                                <input type="number" step="0.01" min="0" th:field="*{price}" class="form-control" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Unit Label</label>
                                <input type="text" th:field="*{unitLabel}" class="form-control" placeholder="e.g. Bag, Pyi, Bottle">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Image</label>
                            <input class="form-control" type="file" name="imageFile" accept="image/*">
                            <div class="mt-2" th:if="${productForm.imageUrl}">
                                <div class="small text-secondary mb-1">Current image preview:</div>
                                <img th:src="${productForm.imageUrl}" alt="Product image" class="img-fluid rounded" style="max-height:160px;">
                            </div>
                            <div class="text-danger small" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
                        </div>

                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" th:field="*{available}" id="availableSwitch">
                            <label class="form-check-label" for="availableSwitch">In stock</label>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" type="submit">Save Product</button>
                            <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
