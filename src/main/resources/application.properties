# Serve uploaded files from the uploads/ directory at runtime
spring.resources.static-locations=classpath:/static/,file:uploads/
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# Upload folder for local fallback (relative to app working dir)
app.upload.dir=uploads/products

